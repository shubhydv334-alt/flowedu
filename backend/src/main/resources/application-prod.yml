# Activated with SPRING_PROFILES_ACTIVE=prod.
# Values without a default are mandatory: the application refuses to start if they are missing.
server:
  # The service runs behind a reverse proxy: use X-Forwarded-* so the login limiter sees the real client address.
  # Only enable this when the backend port is not reachable directly from the internet.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    show-sql: false

flowedu:
  jwt-secret: ${JWT_SECRET}
  cors-origin: ${CORS_ORIGIN}
  seed-demo-data: ${SEED_DEMO_DATA:false}
