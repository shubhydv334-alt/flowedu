server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    # Never put exception messages, stack traces or binding details in error responses.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  datasource:
    # Default: zero-setup embedded H2 file DB.
    # MySQL:      jdbc:mysql://localhost:3306/flowedu
    # PostgreSQL: jdbc:postgresql://localhost:5432/flowedu
    url: ${DB_URL:jdbc:h2:file:./data/flowedu;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
  jpa:
    hibernate:
      # update creates and evolves tables automatically. Use validate or none once the schema is managed externally.
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoint is reachable over HTTP.
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # An unreachable SMTP server must not mark the whole service as down.
      enabled: false

flowedu:
  jwt-secret: ${JWT_SECRET:change-this-secret-change-this-secret-123456}
  jwt-minutes: 720
  # Demo users and sample academic data. Set SEED_DEMO_DATA=false outside local development.
  seed-demo-data: ${SEED_DEMO_DATA:true}
  # Optional first admin account, created only when no user with this email exists yet.
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@flowedu.local}
  telegram-token: ${TELEGRAM_TOKEN:}
  # Chat id that receives Telegram messages during "Send test to me"
  test-telegram-chat-id: ${TEST_TELEGRAM_CHAT_ID:}
  # Date-based triggers (X days before) are evaluated on this schedule
  date-trigger-cron: ${DATE_TRIGGER_CRON:0 0 9 * * *}
  ai:
    # auto = try every provider that has a key (gemini, groq, openrouter) in that order.
    # Or force one: gemini | groq | openrouter | pollinations (pollinations needs no key, demos only).
    provider: ${AI_PROVIDER:auto}
    gemini-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.0-flash}
    groq-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:llama-3.1-8b-instant}
    openrouter-key: ${OPENROUTER_API_KEY:}
    openrouter-model: ${OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct:free}
